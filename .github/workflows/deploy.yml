name: Deploy BusinessAgent

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: "Git branch to deploy"
        required: false
        default: "main"

permissions:
  contents: read

concurrency:
  group: businessagent-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.lock

      - name: Run unit tests
        run: python -m pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.ref_name }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          EXTERNAL_NETWORK: ${{ secrets.EXTERNAL_DOCKER_NETWORK }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          script_stop: true
          command_timeout: 30m
          envs: DEPLOY_REF,DEPLOY_PATH,EXTERNAL_NETWORK
          script: |
            set -euo pipefail

            if [ -z "${DEPLOY_PATH}" ]; then
              echo "VPS_DEPLOY_PATH secret is required."
              exit 1
            fi

            cd "${DEPLOY_PATH}"

            if [ ! -f ".env" ]; then
              echo ".env file is missing in ${DEPLOY_PATH}. Copy it to the VPS before deployment."
              exit 1
            fi

            NETWORK_NAME="${EXTERNAL_NETWORK:-app-network}"
            if ! docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1; then
              docker network create "${NETWORK_NAME}"
            fi

            git fetch origin "${DEPLOY_REF}"
            if git show-ref --verify --quiet "refs/heads/${DEPLOY_REF}"; then
              git checkout "${DEPLOY_REF}"
            else
              git checkout -B "${DEPLOY_REF}" "origin/${DEPLOY_REF}"
            fi
            git pull --ff-only origin "${DEPLOY_REF}"

            docker compose pull
            docker compose up -d --build --remove-orphans
            docker image prune -f

