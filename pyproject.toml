[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "business-agent"
version = "0.1.0"
description = "Dockerized multi-agent business assistant scaffold"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.116.1",
  "uvicorn[standard]==0.35.0",
  "pydantic==2.11.7",
  "pydantic-settings==2.10.1",
  "httpx==0.28.1",
  "redis==5.2.1",
  "rq==2.4.1",
  "qdrant-client==1.14.3",
  "sqlalchemy==2.0.41",
  "psycopg[binary]==3.2.9",
  "python-dateutil==2.9.0.post0",
  "pypdf==5.7.0",
  "python-docx==1.2.0",
  "python-multipart==0.0.20",
  "docxtpl==0.20.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "mypy==1.16.1",
  "ruff==0.12.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "unit: fast unit tests",
  "e2e: fast end-to-end tests",
  "e2e_stack: docker-compose-backed end-to-end tests",
]
